<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  <title>RPS App Integrated</title>

  <!-- Mencegah Error 404 Favicon -->
  <link rel="icon" href="data:,">

  <!-- Library Eksternal -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js'></script>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Pustaka Resmi Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. BASE & GLOBAL STYLES
       ========================================== */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #1a1d23;
      color: white;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    .glass { background: #252a33; border: 1px solid #343b47; border-radius: 12px; }
    .hidden { display: none !important; }
    .val-mini { font-size: 11px; font-weight: 700; color: #ffffff; }

    /* ==========================================
       2. SIDEBAR & MENU STYLING
       ========================================== */
    .sidebar-item { 
      color: #94a3b8; 
      cursor: pointer; 
      border-radius: 10px; 
      transition: 0.3s; 
      padding: 12px;
      display: flex; 
      align-items: center; 
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .active-menu { 
      background: #2d3540 !important; 
      color: #22d3ee !important; 
      border-left: 4px solid #22d3ee !important; 
    }

    .submenu {
      display: block;
      transition: all 0.3s ease;
    }

    .submenu.hidden {
      display: none !important;
    }

    .menu-group.collapsed .submenu {
      display: none !important;
    }

    .menu-group .fa-chevron-down {
      font-size: 10px;
      transition: 0.3s;
    }

    .menu-group.collapsed .fa-chevron-down {
      transform: rotate(-90deg);
    }

    .menu-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: 0.3s;
    }

    .app-title {
      color: #f59e0b;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* ==========================================
       3. FORM, INPUT & UTILITY COMPONENTS
       ========================================== */
    .input-field { background: #1a1d23; border: 1px solid #343b47; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 13px; width: 100%; max-width: 100% !important; }
    .label-mini { font-size: 8px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    
    .progress-bar { height: 5px; border-radius: 10px; background: #343b47; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; transition: width 1s ease-in-out; }
    
    .chart-select { background: #1a1d23; color: #22d3ee; border: 1px solid #343b47; font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; cursor: pointer; outline: none; }
    
    .matrix-btn { font-size: 9px; font-weight: 800; padding: 4px 12px; border-radius: 6px; transition: 0.3s; }
    .matrix-btn.active { background: #22d3ee; color: #000; }
    .matrix-btn.inactive { background: #1a1d23; color: #475569; }
    .matrix-btn.active-tab { background-color: #2563eb !important; color: white !important; border: none !important; }

    .ana-tab-btn { font-size: 10px; font-weight: 900; padding: 8px 20px; border-radius: 8px; transition: 0.3s; text-transform: uppercase; letter-spacing: 0.05em; }
    .ana-tab-btn.active { background: #22d3ee; color: #000; }
    .ana-tab-btn.inactive { background: #1a1d23; color: #475569; border: 1px solid #343b47; }

    input, select, textarea, .glass {
      max-width: 100% !important;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    /* ==========================================
       4. TABLE & MATRIX SYSTEM
       ========================================== */
    .matrix-scroll-container { width: 100%; overflow-x: auto; border: 1px solid #343b47; background: #1a1d23; border-radius: 8px; }
    .matrix-table { min-width: 900px; width: 100%; border-collapse: collapse; font-size: 8.5px; }
    .matrix-table th { padding: 8px 4px; color: #fbbf24 !important; font-weight: 800; border-bottom: 1px solid #343b47; text-align: center; background: #1a1d23; position: sticky; top: 0; z-index: 10; }
    .matrix-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #ffffff05; color: #cbd5e1; }
    .matrix-table .unit-cell { position: sticky; left: 0; z-index: 20; background: #252a33; text-align: left; color: #22d3ee; font-weight: 900; border-right: 2px solid #343b47; padding-left: 10px; }

    .archive-table { width: 100%; font-size: 10px; border-collapse: collapse; }
    .archive-table th { padding: 12px 8px; background: #1a1d23; color: #64748b; font-weight: 800; border-bottom: 1px solid #343b47; text-align: left; }
    .total-row { background: #2d3540; font-weight: 900; color: #22d3ee; }

    /* ==========================================
       5. STICKY COLUMN & HEADER FIXES
       ========================================== */
    .custom-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .overflow-x-auto {
      position: relative;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }

    #tab-dashboardFinance table thead th {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: #1c1f26;
    }

    #tab-dashboardFinance table thead th:nth-child(1),
    #giroTable thead th:nth-child(1) {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 50 !important;
      background-color: #1c1f26 !important;
    }

    #bodyMatriksFinance tr td:nth-child(1),
    #tbodyGiroData tr td:nth-child(1) {
      position: -webkit-sticky !important;
      position: sticky !important;
      left: 0 !important;
      z-index: 30 !important;
      background-color: #131720 !important;
    }

    /* ==========================================
       6. PRINT SYSTEM
       ========================================== */
    #nota-container { background-color: white !important; color: black !important; padding: 10mm !important; }
    #nota-container * { color: black !important; border-color: #444 !important; }
    #nota-container.hidden { display: none !important; }

    @media print {
      @page { size: landscape; margin: 5mm; }
      
      body, body * { visibility: visible !important; }
      #sidebar, .mobile-nav, .no-print, .swal2-container { display: none !important; }
      
      #tab-dashboardFinance { 
        display: block !important; 
        position: static !important; 
        margin-top: 0 !important; 
      }

      .card-container { display: flex !important; width: 100% !important; gap: 4px !important; }
      .card { flex: 1 !important; padding: 4px !important; border: 1px solid #000 !important; font-size: 11px !important; text-align: center; }

      table.matrix-table, table.giro-table { 
        width: 100% !important; 
        border-collapse: collapse !important;
        table-layout: auto !important; 
      }
      
      table.matrix-table th, table.matrix-table td, 
      table.giro-table th, table.giro-table td { 
        font-size: 13px !important; 
        padding: 5px 8px !important; 
        border: 1px solid #000 !important;
        white-space: nowrap !important; 
        -webkit-print-color-adjust: exact !important;
      }
      
      table.matrix-table tr, table.giro-table tr { page-break-inside: avoid !important; }
      table.matrix-table thead, table.giro-table thead { display: table-header-group !important; background: #eee !important; }
      
      table.matrix-table td:nth-child(1), table.matrix-table th:nth-child(1),
      table.giro-table td:nth-child(1), table.giro-table th:nth-child(1) { text-align: left !important; }
      
      table.matrix-table td:nth-child(3), table.matrix-table th:nth-child(3),
      table.giro-table td:nth-child(3), table.giro-table th:nth-child(3) { text-align: left !important; }
      
      table.matrix-table td:not(:nth-child(1)):not(:nth-child(3)), 
      table.matrix-table th:not(:nth-child(1)):not(:nth-child(3)),
      table.giro-table td:not(:nth-child(1)):not(:nth-child(3)), 
      table.giro-table th:not(:nth-child(1)):not(:nth-child(3)) { text-align: center !important; }

      body { background: white !important; color: black !important; }
    }

    /* ==========================================
       7. KONTROL VISIBILITAS DESKTOP VS MOBILE
       ========================================== */
    
    /* MODE DESKTOP & TABLET (Layar > 768px) */
    @media (min-width: 769px) {
      #sidebar { 
        display: flex !important; 
      }
      .mobile-nav, #mobileNavBar { 
        display: none !important; 
      }
      #tab-menu { 
        display: none !important; 
      }
      main {
        padding-bottom: 24px !important;
      }
    }

    /* MODE MOBILE / HP (Layar <= 768px) */
    @media (max-width: 768px) {
      #sidebar { 
        display: none !important; 
      }
      .p-6 { padding: 10px !important; }
      .matrix-table { font-size: 9px; } 
      body { overflow-x: auto; padding-bottom: 70px !important; }

      .mobile-nav, #mobileNavBar {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 48px !important;
        background: #1a1d23;
        display: flex !important;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #343b47;
        z-index: 99999 !important;
        transform: translateZ(0);
        box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      }

      .nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-size: 9px;
        font-weight: 700;
        cursor: pointer;
        height: 100%;
        flex: 1;
        transition: color 0.2s ease;
      }

      .nav-btn.active {
        color: #22d3ee !important; 
        background: rgba(34, 211, 238, 0.05);
      }

      [id^="tab-"] {
        height: auto !important;
        min-height: calc(100vh - 100px);
        padding-bottom: 80px !important;
      }

      /* Tab Finance Input Mobile */
      #tab-financeInput:not(.hidden) {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        overflow-y: visible !important;
        padding-bottom: 100px !important;
      }

      #tab-financeInput:not(.hidden) > div,
      #tab-financeInput:not(.hidden) .flex-1.flex {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        gap: 16px !important;
        overflow: visible !important;
      }

      #tab-financeInput:not(.hidden) .w-5\/12,
      #tab-financeInput:not(.hidden) .w-7\/12,
      #tab-financeInput:not(.hidden) .flex-1.glass.rounded-xl {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
      }

      /* Tab PO & Purchase Mobile */
      #tab-po:not(.hidden), 
      #tab-purchase:not(.hidden) {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        padding-bottom: 90px !important;
      }

      #tab-po:not(.hidden) table thead th,
      #tab-purchase:not(.hidden) table thead th,
      #tab-po:not(.hidden) .sticky,
      #tab-purchase:not(.hidden) .sticky {
        position: static !important;
        top: auto !important;
        box-shadow: none !important;
        z-index: 1 !important;
      }

      table {
        width: max-content !important;
        min-width: 100% !important;
      }

      tr {
        white-space: nowrap !important;
      }

      td.whitespace-normal, 
      th.whitespace-normal {
        white-space: normal !important;
      }
    }

    /* ==========================================
       8. SCROLLBAR & CUSTOM MODALS
       ========================================== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #22d3ee; }
    
    #modalBayar .glass, #modalRevisiCepat .glass, #modalCetakAdvanced .glass {
      width: 100% !important;
      max-width: 55rem !important; 
      margin: auto;
    }

    /* Freeze Header di Atas (Khusus Logistik Analysis) */
    #tab-logistikAnalysis table thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: #1b222d !important;
    }

    /* Freeze Kolom 1 (No) di Kiri (Khusus Logistik Analysis) */
    #tab-logistikAnalysis table th:nth-child(1),
    #tab-logistikAnalysis table td:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: #151a23 !important;
    }

    /* Freeze Kolom 2 (Supplier) di Kiri */
    #tab-logistikAnalysis table th:nth-child(2),
    #tab-logistikAnalysis table td:nth-child(2) {
      position: sticky;
      left: 45px; 
      z-index: 10;
      background-color: #151a23 !important;
      max-width: 120px; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tab-logistikAnalysis table thead th:nth-child(1),
    #tab-logistikAnalysis table thead th:nth-child(2) {
      z-index: 30;
      background-color: #1b222d !important;
    }

    #logistikAnalysisTableBody tr {
      cursor: pointer;
    }
    #logistikAnalysisTableBody tr:active {
      background-color: rgba(255, 255, 255, 0.1) !important;
    }
  </style>
</head>
